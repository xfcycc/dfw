server:
  port: ${PORT:3001}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/dfw}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: room-snapshots
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
  web:
    resources:
      static-locations: file:${WEB_PATH:dist/web}/
game:
  app-origin: ${APP_ORIGIN:}
  flowable:
    schema-update: ${FLOWABLE_SCHEMA_UPDATE:true}
  rules:
    active-version: ${GAME_RULES_ACTIVE_VERSION:classic-v2}
    resources: ${GAME_RULES_RESOURCES:classpath:game-rules/classic-v2.json}
