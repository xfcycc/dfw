server:
  port: ${PORT:3001}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    # 以下为示例配置；运行时通过环境变量或 IDE 配置提供实际连接资料。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/dfw?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:dfw}
    password: ${DB_PASSWORD:change-me}
    hikari:
      pool-name: room-snapshots
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
  web:
    resources:
      static-locations: file:${WEB_PATH:dist/web}/
game:
  app-origin: ${APP_ORIGIN:}
  flowable:
    schema-update: ${FLOWABLE_SCHEMA_UPDATE:true}
  rules:
    economy: ${GAME_RULES_ECONOMY:classpath:game-rules/economy.json}
    map-regions: ${GAME_RULES_MAP_REGIONS:classpath:game-rules/map-regions.json}
    chance-events: ${GAME_RULES_CHANCE_EVENTS:classpath:game-rules/chance-events.json}
    fortune-events: ${GAME_RULES_FORTUNE_EVENTS:classpath:game-rules/fortune-events.json}
    card-events: ${GAME_RULES_CARD_EVENTS:classpath:game-rules/card-events.json}
    turn-rules: ${GAME_RULES_TURN_RULES:classpath:game-rules/turn-rules.json}
